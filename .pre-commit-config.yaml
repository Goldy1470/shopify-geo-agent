# .pre-commit-config.yaml — run `pre-commit install` once; runs on commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
  - repo: local
    hooks:
      - id: mypy-app
        name: mypy app
        entry: python -m mypy app
        language: system
        pass_filenames: false
