<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shopify GEO Agent{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/site.webmanifest">
  <meta name="theme-color" content="#0d1117">
</head>
<body>
  <header>
    <img class="brand-mark" src="/static/logo.svg" alt="GEO Agent logo">
    <span class="mode-badge {{ 'live' if client_live else 'mock' }}">{{ 'LIVE store' if client_live else 'MOCK data' }}</span>
    <nav>
      <a href="/" {% if request.url.path == '/' %}class="on"{% endif %}>Overview</a>
      <a href="/products" {% if request.url.path.startswith('/products') %}class="on"{% endif %}>Products</a>
      <a href="/accessibility" {% if request.url.path.startswith('/accessibility') %}class="on"{% endif %}>Agent access</a>
      <a href="/visibility" {% if request.url.path.startswith('/visibility') %}class="on"{% endif %}>Visibility</a>
      <a href="/fixes" {% if request.url.path.startswith('/fixes') %}class="on"{% endif %}>Fixes</a>
      <a href="/settings" {% if request.url.path.startswith('/settings') %}class="on"{% endif %}>Settings</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
